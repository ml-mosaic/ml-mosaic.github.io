<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic · Off to Patreon</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kit.css?v=20261026c">
<script src="../config.js"></script>
<script src="../assets/session.js"></script>
<script src="../assets/kit.js?v=20261026c" data-root="../"></script>
<style>
  /* The stop between the pricing buttons and Patreon's checkout: what happens next, and a cat ringing up the sale. */
  main { padding: 40px 0 90px; }
  .card { max-width: 720px; margin: 0 auto; background: #120f17; padding: 0 0 26px; --c: var(--tc, #2e2838); }
  .stage { position: relative; height: 210px; overflow: hidden; image-rendering: pixelated;
           background: linear-gradient(#1f1830 0 18%, #2c1d3c 18% 34%, #46243f 34% 50%, #6e2d44 50% 64%, #a8433f 64% 78%, #d8663e 78%); }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
                  background: linear-gradient(#5cc04a 0 4px, #3c9a3a 4px 8px, #6b4a2c 8px); }
  .register { position: absolute; right: 22%; bottom: 26px; width: 144px; height: 108px; z-index: 2;
              background: url(../assets/scenes/register.png) 0 0 / 200% 100% no-repeat; image-rendering: pixelated; }
  .register.open { background-position: 100% 0; }
  .coin { position: absolute; width: 30px; height: 30px; z-index: 3; background: url(../assets/scenes/coin.png) 0 0 / 100% 100%;
          image-rendering: pixelated; opacity: 0; pointer-events: none; }
  .body { padding: 26px 30px 0; }
  .tier { display: inline-block; font-size: 12px; letter-spacing: 2px; padding: 4px 9px; background: var(--tb); color: var(--tf); }
  h1 { font-weight: normal; font-size: clamp(30px, 5vw, 44px); margin: 14px 0 6px; line-height: 1.05; }
  .price { color: var(--dim); margin: 0 0 22px; }
  ol { list-style: none; margin: 0 0 24px; padding: 0; counter-reset: s; }
  ol li { counter-increment: s; display: flex; gap: 14px; margin-bottom: 14px; color: #d8d2c4; line-height: 1.5; font-size: 16px; }
  ol li::before { content: counter(s); flex: none; width: 26px; height: 26px; display: grid; place-items: center; background: var(--tb); color: var(--tf); }
  ol li b { color: #fff; font-weight: normal; }
  .email { background: #1d1826; padding: 10px 14px; margin: -4px 0 22px 40px; color: #b9b0c8; font-size: 14px; line-height: 1.5; }
  .email b { color: var(--yellow); font-weight: normal; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--dim); font-size: 13px; margin-top: 16px; line-height: 1.5; }
  .note a { color: var(--fg); }
  @media (max-width: 560px) { .register { right: 8%; } .body { padding: 22px 18px 0; } }
</style>
</head>
<body>
<nav class="topbar" style="--c:#e8913a"></nav>
<main><div class="wrap">
  <div class="card notch" id="card">
    <div class="stage" id="stage"><div class="register" id="register" title="ka-ching!"></div></div>
    <div class="body">
      <span class="tier" id="tier"></span>
      <h1 id="title"></h1>
      <p class="price" id="price"></p>
      <ol id="steps"></ol>
      <div class="row"><a class="btn" id="go" target="_blank" rel="noopener"></a><a class="btn ghost" href="../pricing/">Back to pricing</a></div>
      <p class="note" id="note"></p>
    </div>
  </div>
</div></main>
<script>
(() => {
  const $ = s => document.querySelector(s), { esc } = Kit;
  Kit.nav("Pricing");
  const TIERS = {
    artisan: { name: "Artisan", price: "$5 / month, free trial first", title: "Start your Artisan trial",
               url: "https://www.patreon.com/checkout/Mosaic_ML?rid=29914408&vanity=17024707&is_free_trial=true",
               go: "Start the free trial on Patreon", tb: "#6b3a1c", tf: "#fff", c: "#e8913a",
               sub: "Subscribe on <b>Patreon</b>: the trial is free, and you can cancel there before it ends." },
    atelier: { name: "Atelier", price: "$15 / month", title: "Join Atelier",
               url: "https://www.patreon.com/checkout/Mosaic_ML?rid=29914428&vanity=17024707",
               go: "Join Atelier on Patreon", tb: "#2c3c74", tf: "#fce060", c: "#fce060",
               sub: "Subscribe on <b>Patreon</b>, which handles the billing." },
  };
  const key = new URLSearchParams(location.search).get("tier");
  const t = TIERS[key] || TIERS.artisan;
  document.title = `Mosaic · ${t.title}`;
  const card = $("#card");
  card.style.setProperty("--tb", t.tb); card.style.setProperty("--tf", t.tf); card.style.setProperty("--tc", t.tb);
  $("#tier").textContent = t.name.toUpperCase(); $("#title").textContent = t.title; $("#price").textContent = t.price;
  $("#go").textContent = t.go; $("#go").href = t.url; $("#go").style.setProperty("--c", t.c);

  // what happens next: link Patreon in settings (when that's on), or use the same email as the Mosaic account
  function steps(u, linking) {
    const email = u?.email ? `<b>${esc(u.email)}</b>` : "the email you use on Mosaic";
    $("#steps").innerHTML = `<li><span>${t.sub}</span></li>` +
      (linking ? `<li><span>Come back and press <b>Link Patreon</b> in your <a href="../settings/#patreon">settings</a>: your plan switches on right away.</span></li>`
               : `<li><span>Use the <b>same email</b> on Patreon as on Mosaic, and we'll switch your plan on.</span></li>`) +
      `<li><span>That's it: your <b>${t.name}</b> badge, allowance and pro Studio show up in the Studio.</span></li>`;
    const old = document.querySelector(".email"); if (old) old.remove();
    $("#steps").insertAdjacentHTML("afterend", `<div class="email">${linking ? "No time to link? " : ""}Use the same email on Patreon as your
      Mosaic account (${email}) so we can match the two${linking ? ", or link it later" : ""}.</div>`);
    $("#note").innerHTML = u ? `Signed in as @${esc(u.username)}. Patreon opens in a new tab.`
      : `No Mosaic account yet? <a href="../login/#signup">Make one first</a>: it's free, and it's what your plan switches on. Patreon opens in a new tab.`;
  }
  steps(null, false);
  Session.api("/api/health", { auth: false }).then(h => {
    const linking = !!h.data?.patreon;
    if (Session.current()) Kit.whoami().then(u => steps(u, linking)); else steps(null, linking);
  });

  // the cat at the cash register: the drawer pops, a coin flies, ka-ching
  Kit.json("../assets/scenes/scenes.json").then(list => {
    const cat = list.find(s => s.animal.name === "cat")?.animal;
    const stage = $("#stage"), reg = $("#register"), P = 5;
    const c = cat && Kit.critter(cat, stage, { left: "18%", bottom: "26px", P });
    let n = 0;
    function ring() {
      reg.classList.add("open"); n++;
      const coin = document.createElement("div"); coin.className = "coin";
      const r = reg.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const x = r.left - s.left + 24, y = r.top - s.top + 70;
      coin.style.left = x + "px"; coin.style.top = y + "px"; stage.appendChild(coin);
      if (!Kit.reduce) coin.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: "translate(-40px,-90px)", opacity: 1, offset: .5 },
                                     { transform: "translate(-80px,-20px)", opacity: 0 }], { duration: 900, easing: "steps(9)" }).onfinish = () => coin.remove();
      else coin.remove();
      if (c && n % 2) Kit.hop(c.el);
      if (n % 3 === 1) Kit.talk(reg, "ka-ching!", 1200);
      setTimeout(() => reg.classList.remove("open"), 700);
    }
    reg.addEventListener("click", ring);
    setTimeout(ring, 600);
    if (!Kit.reduce) setInterval(ring, 2600);
  });
})();
</script>
</body>
</html>
