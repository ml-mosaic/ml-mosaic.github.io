<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic · Off to Patreon</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kit.css?v=20261026f">
<script src="../config.js"></script>
<script src="../assets/session.js"></script>
<script src="../assets/kit.js?v=20261026f" data-root="../"></script>
<script src="../assets/prices.js?v=20261026g"></script>
<script src="../assets/subscribe.js?v=20261026f"></script>
<style>
  /* A direct link to the subscribe popup (/join/?tier=artisan|atelier&mode=join|upgrade|downgrade|cancel): the popup opens
     right away; closing it leaves this little page with the way back. */
  main { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 60px 0; }
  main p { color: var(--dim); }
</style>
</head>
<body>
<nav class="topbar" style="--c:#e8913a"></nav>
<main><div class="wrap"><p>Plans run through Patreon.</p>
  <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn" type="button" id="again" style="--c:#e8913a">Show me again</button><a class="btn ghost" href="../pricing/">See all plans</a></div></div></main>
<script>
(() => {
  Kit.nav("Pricing");
  const q = new URLSearchParams(location.search), tier = q.get("tier") === "atelier" ? "atelier" : "artisan", mode = q.get("mode") || "join";
  const open = () => Subscribe.open(tier, mode);
  document.getElementById("again").onclick = open;
  open();
})();
</script>
</body>
</html>
