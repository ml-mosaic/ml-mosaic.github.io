<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mosaic</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kit.css?v=20261031a">
<script src="../config.js"></script>
<script src="../assets/session.js"></script>
<script src="../assets/kit.js?v=20261031a" data-root="../"></script>
<style>
  /* Owner console. Hidden: not linked anywhere, not indexed, and for anyone but the owner the API answers 404 and
     this page shows "not found". The real protection is server-side (every /api/console call is checked). */
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .nf { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .nf h1 { font-weight: normal; font-size: 72px; margin: 0; }
  .nf p { color: var(--dim); }
  main { padding: 52px 0 80px; }
  .head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .head h1 { font-weight: normal; font-size: 40px; margin: 0; }
  .head .who { color: var(--dim); font-size: 14px; }
  .tabs { margin-left: auto; display: flex; gap: 6px; }
  .tabs button { background: var(--panel); border: 0; color: var(--dim); padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .tabs button[aria-pressed="true"] { background: var(--yellow); color: #000; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 26px; align-items: start; }
  .card { background: var(--panel); padding: 18px; margin: var(--u); }
  .search { display: flex; gap: 10px; margin-bottom: 14px; }
  .search input, .act input { flex: 1; background: #000; border: 0; color: var(--fg); padding: 10px 12px; font: inherit; font-size: 15px; min-width: 0; }
  .list { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; background: #0b0a0e;
         border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
  .row:hover { background: #17151d; } .row[aria-current="true"] { outline: 2px solid var(--yellow); }
  .row img { width: 32px; height: 32px; image-rendering: pixelated; }
  .row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n small { display: block; color: var(--dim); font-size: 12px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-size: 11px; padding: 2px 6px; background: #24212b; color: #b9b0c8; letter-spacing: 1px; text-transform: uppercase; }
  .chip.artisan { background: #6b3a1c; color: #fff; } .chip.atelier { background: #2c3c74; color: #fce060; }
  .chip.suspended { background: var(--yellow); color: #000; } .chip.banned { background: var(--bad); color: #000; }
  .chip.dev { background: #1d3a24; color: var(--green); }
  .detail h2 { font-weight: normal; font-size: 28px; margin: 0; }
  .detail .sub { color: var(--dim); font-size: 13px; margin: 4px 0 16px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .facts div { background: #0b0a0e; padding: 10px; } .facts b { display: block; font-weight: normal; font-size: 18px; }
  .facts span { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .sec { border-top: 2px solid #1d1a24; padding-top: 14px; margin-top: 14px; }
  .sec h3 { font-weight: normal; font-size: 13px; letter-spacing: 2px; color: var(--dim); margin: 0 0 10px; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; background: #0b0a0e; border: 0; color: #b9b0c8; padding: 10px; cursor: pointer; font: inherit; font-size: 14px; }
  .seg button small { display: block; color: var(--dim); font-size: 11px; }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: #000; } .seg button[aria-pressed="true"] small { color: #000; }
  .standing { padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
  .standing.ok { background: #0b1a12; color: var(--green); } .standing.suspended { background: #2a2410; color: var(--yellow); }
  .standing.banned { background: #2a1014; color: var(--bad); }
  .act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .act input.days { flex: 0 0 70px; }
  .posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 46vh; overflow-y: auto; }
  .post { position: relative; background: #000; }
  .post img { width: 100%; aspect-ratio: 1; object-fit: contain; image-rendering: pixelated; display: block; }
  .post .p { font-size: 11px; color: var(--dim); padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post .del { position: absolute; top: 4px; right: 4px; background: var(--bad); color: #000; border: 0; padding: 2px 7px; cursor: pointer; font: inherit; font-size: 12px; }
  .post .vis { position: absolute; top: 4px; left: 4px; font-size: 10px; background: rgba(0,0,0,.7); padding: 1px 5px; color: var(--dim); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .audit { display: flex; flex-direction: column; gap: 4px; }
  .audit div { display: grid; grid-template-columns: 150px 110px 1fr; gap: 12px; padding: 8px 10px; background: #0b0a0e; font-size: 14px; }
  .audit .w { color: var(--dim); }
  .tabs { flex-wrap: wrap; } .tabs .n { background: var(--bad); color: #000; padding: 0 5px; margin-left: 6px; font-size: 11px; }
  .rep { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px; background: #0b0a0e; margin-bottom: 8px; }
  .rep .pic { width: 120px; aspect-ratio: 1; background: #17141e; display: grid; place-items: center; color: var(--dim); font-size: 12px; text-align: center; }
  .rep .pic img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .rep h4 { font-weight: normal; font-size: 16px; margin: 0 0 6px; } .rep p { margin: 0 0 6px; color: #cfc8dc; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .rep .w { color: var(--dim); font-size: 12px; } .rep .act { margin: 10px 0 0; }
  .filter { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter button { background: #0b0a0e; border: 0; color: var(--dim); padding: 6px 11px; cursor: pointer; font: inherit; font-size: 13px; }
  .filter button[aria-pressed="true"] { background: #fff; color: #000; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stats4 div { background: #0b0a0e; padding: 12px; } .stats4 b { display: block; font-weight: normal; font-size: 22px; } .stats4 span { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .tbl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
  .tbl div { display: grid; grid-template-columns: 140px 120px 90px minmax(0, 1fr); gap: 10px; padding: 7px 10px; background: #0b0a0e; font-size: 13px; }
  .tbl div span:last-child { overflow-wrap: anywhere; }
  @media (max-width: 900px) { .rep { grid-template-columns: 1fr; } .stats4 { grid-template-columns: 1fr 1fr; } .tbl div { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .facts { grid-template-columns: 1fr 1fr; } .audit div { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<nav class="topbar" style="--c:var(--bad)"></nav>
<div id="app"></div>
<script>
(() => {
  const $ = s => document.querySelector(s), { esc, toast, ago } = Kit;
  const api = (p, o) => Session.api(p, o);
  const PLANS = [["free", "Free", "15 a day"], ["artisan", "Artisan", "250 a day"],
                 ["atelier", "Atelier", "500 a day + 50 clips"]];
  const notFound = () => {
    $("#app").innerHTML = `<div class="nf"><div><h1>404</h1><p>There's nothing here.</p><a class="btn" href="../">Back home</a></div></div>`;
    document.title = "Mosaic · Not found"; Kit.nav(""); document.body.classList.add("ready");
  };

  (async () => {
    if (!Session.current()) return notFound();
    const r = await api("/api/console/me");
    if (!r.ok) return notFound();
    start(r.data.admin);
  })();

  function start(admin) {
    Kit.nav(""); document.title = "Mosaic · Console";
    $("#app").innerHTML = `<main class="wrap">
      <div class="head"><h1>Console</h1><span class="who">signed in as @${esc(admin)} &middot; owner only</span>
        <div class="tabs"><button type="button" data-t="users" aria-pressed="true">Accounts</button><button type="button" data-t="patreon" aria-pressed="false">Patreon</button><button type="button" data-t="reports" aria-pressed="false">Reports<span class="n" id="n-rep" hidden></span></button><button type="button" data-t="appeals" aria-pressed="false">Appeals<span class="n" id="n-app" hidden></span></button><button type="button" data-t="safety" aria-pressed="false">Safety</button><button type="button" data-t="audit" aria-pressed="false">Audit log</button></div></div>
      <div id="users" class="layout">
        <section class="card notch"><div class="search"><input id="q" placeholder="Search username or email" autocomplete="off"></div>
          <div class="list" id="list"></div></section>
        <section class="card notch detail" id="detail"><div class="empty">Pick an account.</div></section></div>
      <section id="patreon" class="card notch" hidden><div id="pt"></div></section>
      <section id="reports" class="card notch" hidden><div class="filter" id="rep-f"></div><div id="rep-list"></div></section>
      <section id="appeals" class="card notch" hidden><div class="filter" id="app-f"></div><div id="app-list"></div></section>
      <section id="safety" class="card notch" hidden><div id="safe"></div></section>
      <section id="audit" class="card notch" hidden><div class="audit" id="audit-list"></div></section></main>`;
    document.body.classList.add("ready");
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
      for (const t of ["users", "audit", "patreon", "reports", "appeals", "safety"]) $("#" + t).hidden = b.dataset.t !== t;
      history.replaceState(null, "", "#" + b.dataset.t);
      if (b.dataset.t === "audit") loadAudit();
      if (b.dataset.t === "patreon") loadPatreon(false);
      if (b.dataset.t === "reports") loadReports("open");
      if (b.dataset.t === "appeals") loadAppeals("open");
      if (b.dataset.t === "safety") loadSafety();
    });
    // the email links land on a tab (console/#reports, #appeals, #safety)
    const startTab = location.hash.slice(1);
    setTimeout(() => document.querySelector(`.tabs button[data-t="${startTab}"]`)?.click(), 0);
    const counts = async () => {
      const [a, b] = await Promise.all([api("/api/console/reports"), api("/api/console/appeals")]);
      const set = (id, n) => { $(id).hidden = !n; $(id).textContent = n; };
      if (a.ok) set("#n-rep", a.data.open); if (b.ok) set("#n-app", b.data.open);
    };
    counts();

    const when = t => new Date(t * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
    function filters(box, states, cur, load) {
      $(box).innerHTML = states.map(s => `<button type="button" data-s="${s}" aria-pressed="${s === cur}">${s}</button>`).join("");
      $(box).querySelectorAll("button").forEach(b => b.onclick = () => load(b.dataset.s));
    }
    async function loadReports(status) {
      filters("#rep-f", ["open", "resolved", "dismissed", "all"], status, loadReports);
      const r = await api(`/api/console/reports?status=${status}`);
      if (!r.ok) return toast(Session.detail(r.data || {}));
      const R = r.data.reasons;
      $("#rep-list").innerHTML = r.data.reports.length ? r.data.reports.map(x => {
        const s = x.snapshot || {}, what = x.kind === "post" ? `${esc(s.model || "")} by @${esc(s.author || "?")}: &ldquo;${esc(s.prompt || "")}&rdquo;`
          : x.kind === "user" ? `profile of @${esc(x.target)}${s.bio ? ` &middot; bio: ${esc(s.bio)}` : ""}`
          : `forum post by @${esc(s.author || "?")} in &ldquo;${esc(s.title || "")}&rdquo;: ${esc(s.body || "")}`;
        const who = x.kind === "post" ? s.author : x.kind === "user" ? x.target : s.author;
        return `<div class="rep"><div class="pic">${x.image ? `<img src="${MOSAIC.backend}${x.image}" alt="" data-auth>` : esc(x.kind)}</div><div>
          <h4>${esc(R[x.reason] || x.reason)} <span class="chip ${x.status === "open" ? "suspended" : ""}">${esc(x.status)}</span></h4>
          <p>${what}</p>${x.details ? `<p>&ldquo;${esc(x.details)}&rdquo;</p>` : ""}
          <p class="w">reported by @${esc(x.by)} &middot; ${when(x.at)}${x.resolved ? ` &middot; ${esc(x.status)} by @${esc(x.resolved.by)}${x.resolved.note ? `: ${esc(x.resolved.note)}` : ""}` : ""}</p>
          <div class="act">${x.status === "open" ? `<input placeholder="note (optional)" data-note="${esc(x.id)}" maxlength="300">
            <button class="btn small" type="button" data-res="${esc(x.id)}" data-st="resolved" style="--c:var(--green)">Resolved</button>
            <button class="btn small ghost" type="button" data-res="${esc(x.id)}" data-st="dismissed">Dismiss</button>` : `<button class="btn small ghost" type="button" data-res="${esc(x.id)}" data-st="open">Reopen</button>`}
            ${x.kind === "post" ? `<button class="btn small" type="button" data-delpost="${esc(x.target)}" style="--c:var(--bad)">Delete the post</button>` : ""}
            ${who ? `<button class="btn small ghost" type="button" data-open="${esc(who)}">Open @${esc(who)}</button>` : ""}</div></div></div>`;
      }).join("") : `<div class="empty">No ${status === "all" ? "" : status} reports.</div>`;
      $("#rep-list").querySelectorAll("img[data-auth]").forEach(async im => {              // console images need the session
        const res = await fetch(im.src, { headers: { authorization: "Bearer " + Session.current().session } });
        if (res.ok) im.src = URL.createObjectURL(await res.blob()); else im.replaceWith("gone");
      });
      $("#rep-list").querySelectorAll("[data-res]").forEach(b => b.onclick = async () => {
        const note = $(`[data-note="${b.dataset.res}"]`)?.value || "";
        const r2 = await api(`/api/console/reports/${b.dataset.res}`, { json: { status: b.dataset.st, note } });
        if (!r2.ok) return toast(Session.detail(r2.data || {}));
        toast(`Report ${b.dataset.st}`); loadReports(status); counts();
      });
      $("#rep-list").querySelectorAll("[data-delpost]").forEach(b => b.onclick = async () => {
        if (!await Kit.confirm("The post and its image are deleted for good.", { title: "Delete this post?", ok: "Delete", danger: true })) return;
        const r2 = await api(`/api/console/posts/${b.dataset.delpost}/delete`, { json: { reason: "reported" } });
        toast(r2.ok ? "Post deleted" : Session.detail(r2.data || {}));
      });
      $("#rep-list").querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
        document.querySelector('.tabs button[data-t="users"]').click(); $("#q").value = b.dataset.open; loadUsers().then(() => open(b.dataset.open));
      });
    }
    async function loadAppeals(status) {
      filters("#app-f", ["open", "accepted", "rejected", "all"], status, loadAppeals);
      const r = await api(`/api/console/appeals?status=${status}`);
      if (!r.ok) return toast(Session.detail(r.data || {}));
      $("#app-list").innerHTML = r.data.appeals.length ? r.data.appeals.map(a => `<div class="rep" style="grid-template-columns:1fr"><div>
          <h4>@${esc(a.user)} <span class="chip ${a.standing?.status || ""}">${esc(a.standing?.status || "")}</span> <span class="chip">${esc(a.status)}</span></h4>
          <p class="w">Reason given: ${esc(a.standing?.reason || "-")}${a.standing?.until ? ` &middot; until ${when(a.standing.until)}` : ""} &middot; appealed ${when(a.at)}${a.contact ? ` &middot; contact ${esc(a.contact)}` : ""}</p>
          <p>&ldquo;${esc(a.message)}&rdquo;</p>
          ${a.decision ? `<p class="w">${esc(a.status)} by @${esc(a.decision.by)} ${when(a.decision.at)}${a.decision.note ? `: ${esc(a.decision.note)}` : ""}</p>` : ""}
          ${a.status === "open" ? `<div class="act"><input placeholder="note to them (emailed)" data-anote="${esc(a.id)}" maxlength="600">
            <button class="btn small" type="button" data-dec="${esc(a.id)}" data-acc="1" style="--c:var(--green)">Accept: restore the account</button>
            <button class="btn small" type="button" data-dec="${esc(a.id)}" data-acc="0" style="--c:var(--bad)">Reject</button>
            <button class="btn small ghost" type="button" data-open="${esc(a.user)}">Open @${esc(a.user)}</button></div>` : ""}</div></div>`).join("")
        : `<div class="empty">No ${status === "all" ? "" : status} appeals.</div>`;
      $("#app-list").querySelectorAll("[data-dec]").forEach(b => b.onclick = async () => {
        const accept = b.dataset.acc === "1";
        if (!await Kit.confirm(accept ? "Their account is restored and they're emailed." : "They're emailed that the decision stands.", { title: accept ? "Accept this appeal?" : "Reject this appeal?", ok: accept ? "Accept" : "Reject", danger: !accept })) return;
        const r2 = await api(`/api/console/appeals/${b.dataset.dec}`, { json: { accept, note: $(`[data-anote="${b.dataset.dec}"]`)?.value || "" } });
        if (!r2.ok) return toast(Session.detail(r2.data || {}));
        toast(accept ? "Accepted: account restored" : "Rejected"); loadAppeals(status); counts();
      });
      $("#app-list").querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
        document.querySelector('.tabs button[data-t="users"]').click(); $("#q").value = b.dataset.open; loadUsers().then(() => open(b.dataset.open));
      });
    }
    async function loadSafety() {
      const r = await api("/api/console/safety");
      if (!r.ok) return toast(Session.detail(r.data || {}));
      const d = r.data, x = d.express;
      $("#safe").innerHTML = `<div class="stats4">
          <div><b>${d.flags.length}</b><span>REFUSED PROMPTS (RECENT)</span></div><div><b>${d.distill.length}</b><span>API ACCOUNTS FLAGGED</span></div>
          <div><b>${d.votes.up} / ${d.votes.down}</b><span>THUMBS UP / DOWN</span></div>
          <div><b>${x ? `${x.gpu_s.toFixed(0)}s / ${x.budget_s}s` : "off"}</b><span>EXPRESS GPU TODAY${x ? ` &middot; ${x.uses} USES` : ""}${d.express_up ? "" : " &middot; DOWN"}</span></div></div>
        <div class="sec"><h3>API ACCOUNTS FLAGGED AS POSSIBLE HARVESTING (SLOWED UNTIL CLEARED)</h3><div class="tbl">${d.distill.length ? d.distill.map(f =>
          `<div><span>${when(f.at)}</span><span>@${esc(f.user)}</span><span>score ${f.score}</span><span>${esc(f.why.join("; "))} <button class="btn small ghost" type="button" data-clear="${esc(f.user)}">Clear</button></span></div>`).join("")
          : `<div class="empty" style="display:block">Nobody flagged.</div>`}</div></div>
        <div class="sec"><h3>KEEPS TRYING (3+ REFUSED PROMPTS IN 7 DAYS)</h3><div class="tbl">${d.repeat.length ? d.repeat.map(u =>
          `<div><span>${when(u.last)}</span><span>@${esc(u.user)}</span><span>${u.refused}x</span><span><button class="btn small ghost" type="button" data-open="${esc(u.user)}">Open account</button></span></div>`).join("")
          : `<div class="empty" style="display:block">Nobody.</div>`}</div></div>
        <div class="sec"><h3>REFUSED PROMPTS</h3><div class="tbl">${d.flags.length ? d.flags.slice(0, 60).map(f =>
          `<div><span>${when(f.at)}</span><span>${f.user ? "@" + esc(f.user) : esc(f.ip)}</span><span>${esc(f.where)}</span><span>${esc(f.text)}</span></div>`).join("")
          : `<div class="empty" style="display:block">None.</div>`}</div></div>
        <div class="sec"><h3>IPS BLOCKED FOR HAMMERING THE SERVER</h3><div class="tbl">${d.blocks.length ? d.blocks.map(b =>
          `<div><span>until ${when(b.until)}</span><span>${esc(b.ip)}</span><span></span><span></span></div>`).join("") : `<div class="empty" style="display:block">None right now.</div>`}</div></div>`;
      $("#safe").querySelectorAll("[data-clear]").forEach(b => b.onclick = async () => {
        const r2 = await api(`/api/console/safety/distill/${b.dataset.clear}/clear`, { method: "POST" });
        toast(r2.ok ? "Cleared: back to normal speed" : Session.detail(r2.data || {})); loadSafety();
      });
      $("#safe").querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
        document.querySelector('.tabs button[data-t="users"]').click(); $("#q").value = b.dataset.open; loadUsers().then(() => open(b.dataset.open));
      });
    }
    let timer = null, current = null;
    $("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(loadUsers, 200); };
    loadUsers();

    function chips(u) {
      return [u.plan !== "free" ? `<span class="chip ${u.plan}">${u.plan}</span>` : "",
              u.standing ? `<span class="chip ${u.standing.status}">${u.standing.status}</span>` : "",
              u.badges.includes("Developer") ? `<span class="chip dev">dev</span>` : "",
              u.admin ? `<span class="chip">owner</span>` : ""].join("");
    }
    async function loadUsers() {
      const r = await api(`/api/console/users?q=${encodeURIComponent($("#q").value)}`);
      if (!r.ok) return toast(Session.detail(r.data || {}));
      const list = $("#list");
      list.innerHTML = r.data.users.length ? "" : `<div class="empty">No accounts match.</div>`;
      r.data.users.forEach(u => {
        const b = document.createElement("button"); b.type = "button"; b.className = "row";
        b.setAttribute("aria-current", u.username === current);
        b.innerHTML = `<img src="${Kit.pfp(u)}" alt=""><span class="n">@${esc(u.username)}<small>${esc(u.email || "no email")} &middot; ${u.posts} posts &middot; ${u.quota.used}/${u.quota.limit} today</small></span><span class="chips">${chips(u)}</span>`;
        b.onclick = () => open(u.username);
        list.appendChild(b);
      });
    }

    async function open(name) {
      current = name;
      document.querySelectorAll("#list .row").forEach(r => r.setAttribute("aria-current", r.querySelector(".n").firstChild.textContent === "@" + name));
      const r = await api(`/api/console/users/${encodeURIComponent(name)}`);
      if (!r.ok) return toast(Session.detail(r.data || {}));
      const u = r.data, s = u.standing;
      const until = s?.until ? new Date(s.until * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : null;
      $("#detail").innerHTML = `
        <h2>${esc(u.display_name)}</h2>
        <p class="sub">@${esc(u.username)} &middot; ${esc(u.email || "no email")} &middot; joined ${u.created ? new Date(u.created * 1000).toLocaleDateString() : "?"}
          ${u.verified ? "" : "&middot; email not confirmed"}${u.two_factor ? " &middot; two-step on" : ""} ${chips(u)}</p>
        <div class="facts"><div><span>TODAY</span><b>${u.quota.used} / ${u.quota.limit}</b></div><div><span>POSTS</span><b>${u.posts} (${u.shared} shared)</b></div>
          <div><span>PICTURE</span><b>${u.avatar_source === "pattern" ? "default" : esc(u.avatar_source)}</b></div></div>
        <div class="sec"><h3>PLAN</h3>
          <p class="sub" style="margin:0 0 10px">${u.patreon ? `Patreon: linked to <b>${esc(u.patreon.name || "?")}</b> (${esc(u.patreon.email || "no email")}),
            ${u.patreon.plan === "free" ? "no active tier" : esc(u.patreon.plan) + (u.patreon.trial ? " trial" : "")}, checked ${u.patreon.synced ? Kit.ago(u.patreon.synced) : "?"}`
            : "Patreon: not linked"}${u.plan !== "free" ? ` &middot; plan set ${u.plan_source === "patreon" ? "by Patreon" : "by hand (Patreon won't lower it)"}` : ""}</p>
          <div class="seg" id="plan">${PLANS.map(([id, label, what]) =>
          `<button type="button" data-p="${id}" aria-pressed="${u.plan === id}">${label}<small>${what}</small></button>`).join("")}</div></div>
        <div class="sec"><h3>STANDING</h3>
          <div class="standing ${s ? s.status : "ok"}">${!s ? "Good standing." : s.status === "banned"
            ? `Banned${s.reason ? `: ${esc(s.reason)}` : ""}. Their email can't sign up again; their posts and profile are hidden.`
            : `Suspended until ${esc(until)}${s.reason ? `: ${esc(s.reason)}` : ""}.`}</div>
          ${u.admin ? `<p class="sub">Console owners can't be suspended or banned.</p>` : `
          <div class="act"><input class="days" id="days" type="number" min="1" max="3650" value="7" aria-label="Days"><span class="sub" style="margin:0">days</span>
            <input id="reason" placeholder="Reason (shown to them when they try to sign in)" maxlength="200"></div>
          <div class="act">
            <button class="btn small" id="suspend" type="button" style="--c:var(--yellow)">Suspend</button>
            <button class="btn small" id="ban" type="button" style="--c:var(--bad)">Ban</button>
            ${s ? `<button class="btn small" id="restore" type="button" style="--c:var(--green)">${s.status === "banned" ? "Lift ban" : "Lift suspension"}</button>` : ""}
          </div>`}</div>
        <div class="sec"><h3>CONTENT</h3>
          <div class="act"><button class="btn small ghost" id="purge" type="button">Delete all posts and their picture</button></div>
          <div class="posts" id="posts">${u.post_list.length ? "" : `<div class="empty">No posts.</div>`}</div></div>`;
      const reason = () => ($("#reason")?.value || "").trim();
      $("#plan").querySelectorAll("button").forEach(b => b.onclick = async () => {
        if (b.dataset.p === u.plan) return;
        const r = await api(`/api/console/users/${encodeURIComponent(name)}/plan`, { json: { plan: b.dataset.p } });
        if (!r.ok) return toast(Session.detail(r.data || {}));
        toast(`@${name} is on ${PLANS.find(x => x[0] === b.dataset.p)[1]} now`); open(name); loadUsers();
      });
      const act = async (path, body, msg) => {
        const r = await api(`/api/console/users/${encodeURIComponent(name)}/${path}`, { json: body || {} });   // always a POST
        if (!r.ok) return toast(Session.detail(r.data || {}));
        toast(msg); open(name); loadUsers();
      };
      $("#suspend")?.addEventListener("click", async () => {
        const days = +$("#days").value;
        if (!(days > 0)) return toast("How many days?");
        if (await Kit.confirm(`@${name} is signed out everywhere and can't sign in or use the API for ${days} day(s).`, { title: "Suspend this account?", ok: "Suspend", danger: true }))
          act("suspend", { days, reason: reason() }, `Suspended @${name}`);
      });
      $("#ban")?.addEventListener("click", async () => {
        if (await Kit.confirm(`@${name} is signed out for good, their email can't sign up again, and their posts and profile disappear. You can lift it later.`, { title: "Ban this account?", ok: "Ban", danger: true }))
          act("ban", { reason: reason() }, `Banned @${name}`);
      });
      $("#restore")?.addEventListener("click", () => act("restore", {}, `@${name} is back in good standing`));
      $("#purge").onclick = async () => {
        if (await Kit.confirm(`Deletes all ${u.posts} of @${name}'s posts and their profile picture, for good. The account stays.`, { title: "Delete all their content?", ok: "Delete it all", danger: true }))
          act("purge", { reason: reason() }, "Deleted");
      };
      // images through the API with the owner's session (private and hidden posts included), shown from memory
      u.post_list.forEach(p => {
        const d = document.createElement("div"); d.className = "post";
        d.innerHTML = `<img alt="${esc(p.prompt)}" title="${esc(p.prompt)}"><span class="vis">${p.shared ? "shared" : "private"}${p.kind === "video" ? " &middot; v1" : ""}</span>
          <button class="del" type="button" title="Delete this post">&times;</button><div class="p">${esc(p.prompt)}</div>`;
        $("#posts").appendChild(d);
        fetch(MOSAIC.backend + p.image, { headers: { authorization: "Bearer " + Session.current().session } })
          .then(r => r.ok ? r.blob() : null).then(b => { if (b) d.querySelector("img").src = URL.createObjectURL(b); });
        d.querySelector(".del").onclick = async () => {
          if (!await Kit.confirm(`"${p.prompt}" is deleted for good.`, { title: "Delete this post?", ok: "Delete", danger: true })) return;
          const r = await api(`/api/console/posts/${p.id}/delete`, { json: { reason: reason() } });
          if (!r.ok) return toast(Session.detail(r.data || {}));
          d.remove(); toast("Post deleted"); loadUsers();
        };
      });
    }

    // Patreon auto-linking: the last member check, and patrons no account matched (sort those out by hand)
    async function loadPatreon(sync) {
      $("#pt").innerHTML = `<div class="empty">${sync ? "Reading the members from Patreon..." : "Loading..."}</div>`;
      const r = await api(`/api/console/patreon${sync ? "?sync=1" : ""}`);
      if (!r.ok) return $("#pt").innerHTML = `<div class="empty">${esc(Session.detail(r.data || {}))}</div>`;
      const d = r.data;
      if (!d.auto) {
        $("#pt").innerHTML = `<div class="empty">Auto-linking is off: add the creator tokens to the server's config.env.<br><br>
          <button class="btn small ghost" id="pt-mail" type="button">Send me test emails</button></div>`;
        $("#pt-mail").onclick = async () => {
          const r = await api("/api/console/test-emails", { json: {} });
          toast(r.ok ? `Sent to ${r.data.to}: ${r.data.sent.join(", ")}` : Session.detail(r.data || {}), 4000);
        };
        return;
      }
      $("#pt").innerHTML = `<div class="act" style="justify-content:space-between"><span class="sub" style="margin:0">Checked ${d.at ? Kit.ago(d.at) : "never"} &middot;
          ${d.members} members, ${d.active} paying &middot; ${d.changed} change(s) last time</span>
          <span><button class="btn small" id="pt-sync" type="button" style="--c:#ff424d">Check now</button>
          <button class="btn small ghost" id="pt-mail" type="button">Send me test emails</button></span></div>
        <div class="sec"><h3>PATRONS WITHOUT A MATCHING ACCOUNT</h3>${d.unmatched.length ? d.unmatched.map(m =>
          `<div class="row" style="cursor:default"><span></span><span class="n">${esc(m.name || "?")}<small>${esc(m.email || "no email")} &middot; ${esc(m.why)}</small></span>
             <span class="chips"><span class="chip ${esc(m.plan)}">${esc(m.plan)}${m.trial ? " trial" : ""}</span></span></div>`).join("")
          : `<div class="empty">Everyone paying is linked.</div>`}</div>
        <p class="sub">To fix one: find their Mosaic account and set the plan by hand, or ask them to press Link Patreon in their settings.</p>`;
      $("#pt-sync").onclick = () => loadPatreon(true);
      $("#pt-mail").onclick = async () => {
        const r = await api("/api/console/test-emails", { json: {} });
        toast(r.ok ? `Sent to ${r.data.to}: ${r.data.sent.join(", ")}` : Session.detail(r.data || {}), 4000);
      };
    }

    async function loadAudit() {
      const r = await api("/api/console/audit");
      if (!r.ok) return toast(Session.detail(r.data || {}));
      const what = e => ({ plan: `plan ${e.old} → ${e.new}`, suspend: `suspended ${e.days} day(s)`, ban: "banned", restore: "restored",
                           purge: `deleted ${e.posts} posts${e.picture ? " + picture" : ""}`, delete_post: `deleted post "${e.prompt}"` }[e.action] || e.action);
      $("#audit-list").innerHTML = r.data.entries.length ? r.data.entries.map(e =>
        `<div><span class="w">${new Date(e.at * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" })}</span><span>@${esc(e.target)}</span>
          <span>${esc(what(e))}${e.reason ? ` <span class="w">&middot; ${esc(e.reason)}</span>` : ""} <span class="w">&middot; by @${esc(e.by)}</span></span></div>`).join("")
        : `<div class="empty">Nothing yet.</div>`;
    }
  }
})();
</script>
</body>
</html>
